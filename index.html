<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c7ff1a"><title>Букет с характером — Skillbox</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css?v=20260928-2"></head>
<body><header class="topbar"><a class="wordmark" href="./">Skillbox</a><span class="occasion">Цветочная лавка ко Дню учителя</span><button class="text-button" id="restart">Начать заново</button></header>
<main class="studio"><section class="stage" aria-label="Ваш букет"><div class="stage-heading"><h1>Большое спасибо.<br><span>В вашем букете.</span></h1><p>Для тех, кто помогает учиться.</p></div><div class="stage-decoration" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M50 0V100M0 50H100M15 15L85 85M15 85L85 15" stroke="currentColor" stroke-width="5"/></svg></div><button id="preview" class="preview" aria-label="Рассмотреть открытку крупно"><span id="art"></span></button><div class="stage-bottom"><span id="composition-name">Цветочный</span><div><button id="shuffle" class="round-action" title="Другая композиция" aria-label="Другая композиция"><svg viewBox="0 0 24 24"><path d="M20 7V2l-3 3A8 8 0 104 17M20 2h-5"/></svg></button><button id="undo" class="round-action" title="Вернуть предыдущую композицию" aria-label="Вернуть предыдущую композицию" disabled><svg viewBox="0 0 24 24"><path d="M8 5L3 10l5 5M3 10h10a6 6 0 010 12" transform="translate(0 -3)"/></svg></button><button id="zoom" class="round-action" title="Увеличить" aria-label="Увеличить открытку"><svg viewBox="0 0 24 24"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button></div></div></section>
<section class="workbench" aria-label="Конструктор букета"><nav class="steps" aria-label="Шаги"><button data-step="0" aria-current="step">1 <span>Собрать</span></button><button data-step="1">2 <span>Завернуть</span></button><button data-step="2">3 <span>Поздравить</span></button></nav><div id="panel" class="panel"></div><div class="actionbar"><span id="help"></span><button id="next" class="primary">Завернуть букет <span>→</span></button></div></section></main>
<div id="toast" role="status" aria-live="polite"></div><dialog id="large-preview" aria-label="Предпросмотр открытки"><button class="close-button" id="close-preview" aria-label="Закрыть просмотр">Закрыть ×</button><div id="large-art"></div><p>Так будет выглядеть ваша открытка</p></dialog><script src="artwork.js"></script><script src="app.js?v=20260928-2"></script></body></html>
