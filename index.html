<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3D3BFF">
  <title>Букет с характером — Skillbox</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="vendor/skillbox/tokens.css">
  <link rel="stylesheet" href="vendor/skillbox/components.css">
  <link rel="stylesheet" href="styles.css?v=20260930-6">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="Skillbox"><img src="vendor/skillbox/logos/Logo_Skillbox_Black.svg" alt="Skillbox"></a>
    <span class="occasion">Цветочная лавка ко Дню учителя</span>
    <button class="text-button" id="restart">Начать заново</button>
  </header>
  <main class="studio">
    <section class="stage" aria-label="Ваш букет">
      <div class="stage-heading"><h1>Букет с<br>характером</h1><p>Соберите своё спасибо</p></div>
      <div id="preview" class="preview"><span id="art"></span></div>
      <div class="drag-hint" id="drag-hint">Предметы можно двигать прямо в букете</div>
      <div class="stage-bottom"><span id="composition-name">Цветочный</span><div>
        <button id="undo" class="round-action" title="Отменить" aria-label="Отменить" disabled><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h9a6 6 0 0 1 6 6"/></svg></button>
        <button id="zoom" class="round-action" title="Увеличить" aria-label="Увеличить открытку"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </div></div>
    </section>
    <section class="workbench" aria-label="Конструктор букета">
      <nav class="steps" aria-label="Шаги"><button data-step="0" aria-current="step">1 <span>Собрать</span></button><button data-step="1">2 <span>Завернуть</span></button><button data-step="2">3 <span>Поздравить</span></button></nav>
      <div id="panel" class="panel"></div>
      <div class="actionbar"><span id="help"></span><button id="next" class="primary">Завернуть букет <span>→</span></button></div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="large-preview" aria-label="Предпросмотр открытки"><button class="close-button" id="close-preview" aria-label="Закрыть просмотр">Закрыть ×</button><div id="large-art"></div><p>Так будет выглядеть ваша открытка</p></dialog>
  <script src="vendor/skillbox/components.js"></script><script src="artwork.js?v=20260930-6"></script><script src="app.js?v=20260930-6"></script>
</body>
</html>
